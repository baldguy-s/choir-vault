<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choir — Admin</title>
<meta name="theme-color" content="#B5B5B5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FAFAFA;
  --paper-dim: #F0F0F0;
  --card: #FFFFFF;
  --line: rgba(0,0,0,0.10);
  --ink: #1A1A1A;
  --slate: #6B6B6B;
  --red: #A3313B;
  --red-deep: #7E2530;
  --banner-gray: #B5B5B5;
  /* Banner keeps these in dark mode: the logo's dark "CHURCH" lettering is part
     of the image and vanishes against a dark banner. */
  --banner-bg: #B5B5B5;
  --banner-fg: #1A1A1A;
  --banner-fg-soft: #3A3A3A;
  --ok: #2F6B3A;
  --ok-bg: #E7F3E9;
  --warn-bg: #FBEAEA;
  --radius: 4px;
  --font-display: "Playfair Display", Georgia, serif;
  --font-body: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

body.dark-mode {
  --paper: #17181A;
  --paper-dim: #232426;
  --card: #1F2022;
  --line: rgba(255,255,255,0.12);
  --ink: #F0EFEC;
  --slate: #A3A3A3;
  --red: #C6505C;
  --red-deep: #E08691;
  --banner-gray: #4A4A4A;
  --ok: #8FC79B;
  --ok-bg: #25381F;
  --warn-bg: #3A2323;
}

* { box-sizing: border-box; }
html { font-size: 16px; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
body { padding-bottom: 4rem; }
a { color: var(--red-deep); }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--red-deep); outline-offset: 2px; }

/* ---------- Banner (matches the public app + Service Schedule) ---------- */

header.site {
  background: var(--banner-bg);
  color: var(--banner-fg);
  padding: 18px 18px 14px;
  text-align: center;
  border-bottom: 1px solid rgba(0,0,0,0.15);
}
header.site img.logo-img { max-width: 180px; width: 55%; height: auto; display: block; margin: 0 auto 6px; }
header.site h1 {
  font-family: var(--font-display);
  font-weight: 800; font-size: 1rem;
  margin: 2px 0 3px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--banner-fg);
}
header.site p { margin: 0; font-size: .72rem; letter-spacing: .13em; text-transform: uppercase; color: var(--banner-fg-soft); }

.sticky-bar { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
.sticky-bar-inner { max-width: 900px; margin: 0 auto; padding: .45rem 1rem; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.bar-spacer { flex: 1; }

.tab-btn {
  background: none; border: 1px solid transparent; color: var(--slate);
  font-size: .85rem; font-weight: 600; padding: .4rem .8rem; border-radius: 999px;
}
.tab-btn.active { background: var(--ink); color: var(--paper); }
.tab-btn:hover { color: var(--red-deep); }

.conn-pill {
  font-family: var(--font-mono); font-size: .62rem; text-transform: uppercase;
  letter-spacing: .04em; padding: .2rem .5rem; border-radius: 999px;
  border: 1px solid var(--line); color: var(--slate);
}
.conn-pill.connected { background: var(--ok); border-color: var(--ok); color: #fff; }
.conn-pill.bad { border-color: var(--red-deep); color: var(--red-deep); }

.icon-btn { background: var(--card); border: 1px solid var(--line); color: var(--ink); padding: .35rem .55rem; border-radius: 999px; font-size: 1rem; line-height: 1; }

.config-warning { background: var(--warn-bg); color: var(--red-deep); border-bottom: 1px solid var(--red); padding: .85rem 1.25rem; font-size: .9rem; }
.config-warning code { background: rgba(0,0,0,0.06); padding: .1rem .3rem; border-radius: 3px; }

.wrap { max-width: 900px; margin: 0 auto; padding: 1.1rem 1rem 1rem; }

/* ---------- Cards + fields ---------- */

.gate-card, .section-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 6px; padding: 1.1rem 1.15rem; margin-bottom: 1rem;
}
.gate-card { margin-top: 1.5rem; }
.gate-card h2 { font-family: var(--font-display); margin-top: 0; }
.gate-card p { color: var(--slate); font-size: .92rem; line-height: 1.5; }

.section-card h3 {
  font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase;
  letter-spacing: .06em; color: var(--red-deep); margin: 0 0 .85rem;
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
}
.section-card h3 .h3-note { font-family: var(--font-body); text-transform: none; letter-spacing: 0; color: var(--slate); font-weight: 400; font-size: .78rem; }

.field-row { margin-bottom: .9rem; }
.field-row label, .field-label {
  display: block; font-size: .72rem; font-weight: 700; color: var(--slate);
  margin-bottom: .3rem; text-transform: uppercase; letter-spacing: .04em;
}
.field-row input[type="text"], .field-row input[type="password"], .field-row input[type="url"],
.field-row input[type="date"], .field-row textarea, .field-row select,
.inline-input, .inline-select {
  width: 100%; padding: .55rem .7rem; border: 1px solid var(--line);
  border-radius: var(--radius); font-size: .95rem; background: var(--card); color: var(--ink);
}
.field-row textarea { resize: vertical; min-height: 4rem; }
.field-row textarea.lyrics-input { min-height: 11rem; font-size: .9rem; line-height: 1.55; }
.field-hint { font-size: .78rem; color: var(--slate); margin-top: .3rem; line-height: 1.45; }

.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .55rem 1rem; border-radius: var(--radius);
  border: 1px solid var(--red); background: var(--red); color: #fff;
  font-weight: 600; font-size: .88rem;
}
.btn:hover { background: var(--red-deep); border-color: var(--red-deep); }
.btn.secondary { background: var(--card); color: var(--red-deep); border-color: var(--red); }
.btn.secondary:hover { background: var(--warn-bg); }
.btn.plain { background: var(--card); border-color: var(--line); color: var(--ink); }
.btn.plain:hover { border-color: var(--red); color: var(--red-deep); background: var(--card); }
.btn.danger { background: var(--card); color: var(--red-deep); border-color: var(--red-deep); }
.btn.danger:hover { background: var(--red-deep); color: #fff; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.small { padding: .35rem .65rem; font-size: .78rem; }
.btn.tiny { padding: .2rem .45rem; font-size: .7rem; font-family: var(--font-mono); }

.btn-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

/* ---------- Songs list ---------- */

.toolbar { display: flex; gap: .5rem; margin-bottom: .9rem; flex-wrap: wrap; }
.toolbar input[type="search"] {
  flex: 1; min-width: 150px; padding: .55rem .7rem;
  border: 1px solid var(--line); border-radius: var(--radius);
  font-size: .95rem; background: var(--card); color: var(--ink);
}

.tag-row { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tag-chip {
  font-family: var(--font-mono); font-size: .68rem; background: var(--paper-dim);
  border: 1px solid var(--line); color: var(--slate); padding: .25rem .6rem; border-radius: 999px;
}
.tag-chip.active { background: var(--red); border-color: var(--red-deep); color: #fff; }
.tag-chip.upcoming-chip { font-family: var(--font-body); font-weight: 700; border-color: var(--red); color: var(--red-deep); }
.tag-chip.upcoming-chip.active { color: #fff; }

/* A–Z groups, matching the public app so the two lists behave the same way */
.list-tools { display: flex; align-items: center; gap: .5rem; margin-bottom: .7rem; flex-wrap: wrap; }
.list-tools .count { font-family: var(--font-mono); font-size: .68rem; color: var(--slate); margin-left: auto; }

.mini-btn {
  background: none; border: 1px solid var(--line); color: var(--slate);
  font-size: .72rem; font-weight: 600; padding: .25rem .55rem; border-radius: 999px;
}
.mini-btn:hover { color: var(--red-deep); border-color: var(--red); }

.letter-groups { display: flex; flex-direction: column; gap: .4rem; }

.letter-group { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }

.letter-head {
  width: 100%; display: flex; align-items: center; gap: .7rem;
  background: var(--card); border: none; padding: .6rem .9rem; text-align: left; color: var(--ink);
}
.letter-head:hover { background: var(--paper-dim); }
.letter-head .letter { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; line-height: 1; color: var(--red); width: 1.4rem; }
.letter-head .letter-count { font-family: var(--font-mono); font-size: .7rem; color: var(--slate); flex: 1; }
.letter-head .twisty { font-family: var(--font-mono); font-size: .9rem; color: var(--slate); line-height: 1; }

.letter-group.collapsed .letter-body { display: none; }
.letter-body { border-top: 1px solid var(--line); padding: .4rem; }
.letter-body .song-row:last-child { margin-bottom: 0; }

.song-row {
  background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--banner-gray);
  border-radius: var(--radius); padding: .75rem .9rem; margin-bottom: .5rem;
  display: flex; align-items: center; gap: .7rem; cursor: pointer;
}
.song-row:hover { border-left-color: var(--red); }
.song-row .info { flex: 1; min-width: 0; }
.song-row .title { font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.song-row .counts { font-family: var(--font-mono); font-size: .68rem; color: var(--slate); margin-top: .2rem; }
.song-row .chev { color: var(--slate); font-size: 1.1rem; }

.pre-badge {
  font-family: var(--font-mono); font-size: .58rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: #fff; background: var(--slate); padding: .12rem .4rem; border-radius: 999px;
}

.empty-state { text-align: center; padding: 2.2rem 1rem; color: var(--slate); }
.empty-state .big { font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); margin-bottom: .3rem; }

/* ---------- Detail ---------- */

/* Sticks below the tab bar so Back and the song title stay reachable while
   scrolling a long song. --admin-bar-h is measured in JS because the tab bar
   wraps to two rows on narrow screens. */
.detail-header {
  position: sticky;
  top: var(--admin-bar-h, 3rem);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: .7rem;
  flex-wrap: nowrap;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  margin: -1.1rem -1rem 1.1rem;   /* bleed past .wrap padding so nothing shows behind */
  padding: .7rem 1rem;
}
.detail-header h2 {
  font-family: var(--font-display);
  margin: 0; flex: 1; min-width: 0; font-size: 1.15rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.detail-header .btn { flex-shrink: 0; }

/* ---------- Track / sheet / link rows ---------- */

.item-row {
  display: grid; gap: .5rem; align-items: center;
  padding: .6rem 0; border-bottom: 1px solid var(--line);
  grid-template-columns: 1fr;
}
.item-row:last-of-type { border-bottom: none; }

.item-row .row-meta { font-family: var(--font-mono); font-size: .66rem; color: var(--slate); word-break: break-all; }
.item-row .row-actions { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; }
.reorder-btns { display: flex; gap: .2rem; }

@media (min-width: 620px) {
  .track-row { grid-template-columns: auto minmax(0,1fr) minmax(0,1.1fr) auto; }
  .sheet-row { grid-template-columns: auto minmax(0,1fr) minmax(0,1fr) auto; }
  .link-row  { grid-template-columns: minmax(0,1fr) minmax(0,1.3fr) auto; }
  .dir-row   { grid-template-columns: auto minmax(0,1fr) minmax(0,1.4fr) 6.5rem auto; }
  .cal-song-row { grid-template-columns: auto minmax(0,1fr) 6rem minmax(0,1fr) auto; }
}

.replace-input { font-size: .72rem; max-width: 100%; color: var(--slate); }

.add-block { margin-top: .9rem; padding-top: .9rem; border-top: 1px dashed var(--line); }

.preset-row { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: .6rem; align-items: center; }
.preset-chip {
  font-family: var(--font-mono); font-size: .68rem; background: var(--paper-dim);
  border: 1px solid var(--line); color: var(--ink); padding: .25rem .6rem; border-radius: 999px;
}
.preset-chip:hover { background: var(--red); border-color: var(--red-deep); color: #fff; }

.save-status { font-size: .78rem; color: var(--slate); margin-top: .5rem; min-height: 1.1em; }
.save-status.ok { color: var(--ok); }
.save-status.err { color: var(--red-deep); }

.checkbox-row { display: flex; align-items: flex-start; gap: .5rem; font-size: .88rem; color: var(--ink); margin: .6rem 0; }
.checkbox-row input { margin-top: .2rem; flex-shrink: 0; }
.checkbox-row .cb-note { display: block; font-size: .78rem; color: var(--slate); }

.danger-zone { border-color: var(--red-deep); background: var(--warn-bg); }
.danger-zone h3 { color: var(--red-deep); }

/* ---------- Calendar editor ---------- */

.svc-card {
  background: var(--card); border: 1px solid var(--line);
  border-left: 4px solid var(--red); border-radius: var(--radius);
  padding: .8rem .9rem; margin-bottom: .8rem;
}
.svc-head { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .5rem; }
.svc-title { font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; flex: 1; min-width: 9rem; }
.svc-past { font-family: var(--font-mono); font-size: .58rem; text-transform: uppercase; letter-spacing: .05em; color: #fff; background: var(--slate); padding: .12rem .4rem; border-radius: 999px; }
.svc-edit-row { display: grid; gap: .5rem; grid-template-columns: 1fr; margin-bottom: .6rem; }
@media (min-width: 620px) { .svc-edit-row { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }

.tbd-note { font-size: .85rem; color: var(--slate); font-style: italic; padding: .3rem 0; }

/* ---------- News editor ---------- */

.paste-box {
  min-height: 11rem; max-height: 26rem; overflow-y: auto;
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: .7rem .8rem; background: var(--card); color: var(--ink);
  font-size: .93rem; line-height: 1.55;
}
.paste-box:empty::before { content: attr(data-placeholder); color: var(--slate); }
.paste-box p { margin: 0 0 .7rem; }
.paste-box ul, .paste-box ol { margin: 0 0 .7rem; padding-left: 1.3rem; }
.paste-box h3, .paste-box h4 { font-family: var(--font-display); font-size: 1rem; margin: .8rem 0 .3rem; }
.paste-box blockquote { margin: 0 0 .7rem; padding-left: .8rem; border-left: 3px solid var(--line); color: var(--slate); }

/* ---------- Sync card ---------- */

.sync-card { border-color: var(--line); }
.sync-log { font-family: var(--font-mono); font-size: .7rem; color: var(--slate); line-height: 1.6; margin-top: .5rem; white-space: pre-wrap; }

/* ---------- Toast ---------- */

.toast {
  position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: .6rem 1.05rem;
  border-radius: 6px; font-size: .85rem; z-index: 100; max-width: 92vw;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
}
.toast.error { background: var(--red-deep); color: #fff; }
</style>
</head>
<body>

<header class="site">
  <img class="logo-img" src="icons/bbcff-logo.png" alt="Bible Baptist Church of Fort Fairfield logo">
  <h1>Choir &middot; Admin</h1>
</header>

<div class="sticky-bar">
  <div class="sticky-bar-inner">
    <button class="tab-btn" data-tab="songs">Songs</button>
    <button class="tab-btn" data-tab="calendar">Calendar</button>
    <button class="tab-btn" data-tab="news">Choir News</button>
    <span class="bar-spacer"></span>
    <span class="conn-pill" id="conn-pill">Checking&hellip;</span>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode">&#9789;</button>
  </div>
</div>

<div id="config-warning" class="config-warning" style="display:none">
  Repo not configured. Open this file and set <code>GH_OWNER</code> and
  <code>GH_REPO</code> near the top of the <code>&lt;script&gt;</code> block before using this page.
</div>

<div class="wrap" id="app-root"></div>

<script>
/* ================================================================
   CONFIG
   ================================================================ */
const GH_OWNER  = 'baldguy-s';
const GH_REPO   = 'choir-vault';
const GH_BRANCH = 'main';

const SONGS_PATH    = 'docs/data/songs.json';
const CALENDAR_PATH = 'docs/data/calendar.json';

/* Standard voice-part names, offered as quick-picks. Any custom name is allowed. */
const TRACK_PARTS = ['Demo', 'Soprano', 'Alto', 'Tenor', 'Bass'];

const PAT_STORAGE_KEY = 'gh_pat_choir_music';
const GH_API = 'https://api.github.com';

/* --- Service Schedule repo: this app is the source of truth for choir slot/solo --- */
const SCHED_OWNER  = 'baldguy-s';
const SCHED_REPO   = 'bbcff-serv-sched';
const SCHED_BRANCH = 'main';
const SCHED_PATH   = 'schedule-data.json';
const SCHED_PAT_KEY = 'gh_pat_sched_sync';   /* optional; falls back to the main token */

/* Only Sunday services carry a choir block in the schedule app's model. */
const SCHED_SYNC_TYPES = ['sunday_am', 'sunday_pm'];

const SERVICE_TYPES = {
  sunday_am: { short: 'Morning',   long: 'Sunday Morning',  order: 0 },
  sunday_pm: { short: 'Evening',   long: 'Sunday Evening',  order: 1 },
  wednesday: { short: 'Wednesday', long: 'Wednesday',       order: 2 },
  special:   { short: 'Special',   long: 'Special Service', order: 3 },
};

const SLOT_OPTIONS = ['', '1', '4'];

/* Must match CALENDAR_DAYS_AHEAD in js/app.js so "Upcoming" means the same
   thing in both places: the current service plus the next two weeks. */
const CALENDAR_DAYS_AHEAD = 20;
const UPCOMING_FILTER = '__upcoming';

/* Contact field kinds — decide whether the public app makes the value tappable. */
const CONTACT_TYPES = [
  { value: 'text',  label: 'Text' },
  { value: 'email', label: 'Email' },
  { value: 'phone', label: 'Phone' },
  { value: 'link',  label: 'Link' },
];

const GH_PLACEHOLDERS = (GH_OWNER === 'owner' || GH_REPO === 'repo');
const THEME_KEY = 'choir_admin_theme';

let STATE = {
  songs: [],
  songsSha: null,
  calendar: {
    news: { subject: '', date: '', html: '', updated: '' },
    director: { name: '', note: '', fields: [] },
    services: [],
  },
  calSha: null,
  tab: 'songs',
  activeTag: null,
  searchQuery: '',
};

/* Which A–Z groups are open. Starts empty so the list opens collapsed, same as
   the public app. Survives re-renders within the session. */
let expandedLetters = new Set();

const root = document.getElementById('app-root');
const connPill = document.getElementById('conn-pill');
const themeBtn = document.getElementById('theme-btn');

init();

async function init() {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  applyStoredTheme();
  themeBtn.addEventListener('click', toggleTheme);

  syncBarHeight();
  window.addEventListener('resize', syncBarHeight);

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.tab = btn.dataset.tab;
      renderTab();
      scrollToTop();
    });
  });

  if (GH_PLACEHOLDERS) {
    document.getElementById('config-warning').style.display = 'block';
    setConn('Not configured', 'bad');
    return;
  }

  if (!getToken()) { renderPatGate(); return; }

  setConn('Connecting…');
  try {
    await Promise.all([loadSongs(), loadCalendar()]);
    setConn('Connected', 'connected');
    renderTab();
  } catch (err) {
    console.error(err);
    setConn('Connection failed', 'bad');
    renderPatGate(err.message);
  }
}

function setConn(text, cls) {
  connPill.textContent = text;
  connPill.className = 'conn-pill' + (cls ? ' ' + cls : '');
}

function syncTabButtons() {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === STATE.tab);
  });
}

/* ---------------- Theme ---------------- */

function applyStoredTheme() {
  let pref = null;
  try { pref = localStorage.getItem(THEME_KEY); } catch {}
  if (pref === null && window.matchMedia) {
    pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  setTheme(pref === 'dark');
}

function setTheme(dark) {
  document.body.classList.toggle('dark-mode', dark);
  themeBtn.innerHTML = dark ? '&#9788;' : '&#9789;';
}

function toggleTheme() {
  const dark = !document.body.classList.contains('dark-mode');
  setTheme(dark);
  try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch {}
}

/* ---------------- PAT gate ---------------- */

function getToken() {
  try { return localStorage.getItem(PAT_STORAGE_KEY); } catch { return null; }
}

function renderPatGate(errorMsg) {
  syncTabButtons();
  scrollToTop();
  root.innerHTML = `
    <div class="gate-card">
      <h2>Connect to GitHub</h2>
      <p>Paste a fine-grained personal access token with <strong>Contents: Read and write</strong> on
      <strong>${escapeHtml(GH_OWNER)}/${escapeHtml(GH_REPO)}</strong>. To keep the Service Schedule in
      sync automatically, give the same token access to
      <strong>${escapeHtml(SCHED_OWNER)}/${escapeHtml(SCHED_REPO)}</strong> as well.
      It is stored only in this browser, and sent nowhere but GitHub.</p>

/* ================================================================
   GitHub Contents API
   ================================================================ */

function ghHeaders(token) {
  return {
    'Authorization': `Bearer ${token || getToken()}`,
    'Accept': 'application/vnd.github+json',
  };
}

async function apiGetFile(owner, repo, branch, path, token) {
  const url = `${GH_API}/repos/${owner}/${repo}/contents/${encodePath(path)}?ref=${encodeURIComponent(branch)}`;
  const res = await fetch(url, { headers: ghHeaders(token) });
  if (res.status === 404) return null;
  if (!res.ok) {
    const err = new Error(`GitHub GET ${path} failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  return { sha: data.sha, content: b64DecodeUnicode(data.content) };
}

async function apiPut(owner, repo, branch, path, base64Content, message, sha, token) {
  const body = { message, content: base64Content, branch };
  if (sha) body.sha = sha;
  const res = await fetch(`${GH_API}/repos/${owner}/${repo}/contents/${encodePath(path)}`, {
    method: 'PUT',
    headers: { ...ghHeaders(token), 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const e = new Error(`Save failed (${res.status}): ${err.message || 'unknown error'}`);
    e.status = res.status;
    throw e;
  }
  return res.json();
}

function ghGetFile(path) { return apiGetFile(GH_OWNER, GH_REPO, GH_BRANCH, path); }
function ghPutText(path, contentStr, message, sha) {
  return apiPut(GH_OWNER, GH_REPO, GH_BRANCH, path, b64EncodeUnicode(contentStr), message, sha);
}
function ghPutBase64(path, base64, message, sha) {
  return apiPut(GH_OWNER, GH_REPO, GH_BRANCH, path, base64, message, sha);
}

async function ghDeleteFile(path, sha, message) {
  const res = await fetch(`${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/${encodePath(path)}`, {
    method: 'DELETE',
    headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, sha, branch: GH_BRANCH }),
  });
  return res.ok;
}

/* Delete a repo file given its app-relative path (e.g. 'audio/song/bass.mp3'). */
async function deleteRepoFile(appPath, message) {
  const repoPath = `docs/${appPath}`;
  try {
    const file = await ghGetFile(repoPath);
    if (!file) return true;            /* already gone */
    return await ghDeleteFile(repoPath, file.sha, message);
  } catch (err) {
    console.error('Could not delete', repoPath, err);
    return false;
  }
}

function encodePath(path) {
  return String(path).split('/').map(encodeURIComponent).join('/');
}

/* ---------------- Load / save ---------------- */

async function loadSongs() {
  const file = await ghGetFile(SONGS_PATH);
  if (!file) { STATE.songs = []; STATE.songsSha = null; return; }
  const parsed = JSON.parse(file.content);
  STATE.songs = parsed.songs || [];
  STATE.songsSha = file.sha;
}

async function loadCalendar() {
  const file = await ghGetFile(CALENDAR_PATH);
  if (!file) {
    STATE.calendar = { news: { subject: '', date: '', html: '', updated: '' }, services: [] };
    STATE.calSha = null;
    return;
  }
  const parsed = JSON.parse(file.content);
  STATE.calendar = {
    news: parsed.news || { subject: '', date: '', html: '', updated: '' },
    director: normaliseDirector(parsed.director),
    services: parsed.services || [],
  };
  STATE.calSha = file.sha;
}

function normaliseDirector(d) {
  const src = d || {};
  return {
    name: src.name || '',
    note: src.note || '',
    fields: Array.isArray(src.fields) ? src.fields.map(f => ({
      label: (f && f.label) || '',
      value: (f && f.value) || '',
      type: (f && f.type) || 'text',
    })) : [],
  };
}

/* Retries once on 409/422, which means the file changed since we loaded it
   (e.g. a git push landed while this page was open). */
async function saveJsonWithRetry(path, dataObj, message, shaKey, stringify) {
  const contentStr = stringify ? stringify(dataObj) : JSON.stringify(dataObj, null, 2) + '\n';
  try {
    const result = await ghPutText(path, contentStr, message, STATE[shaKey]);
    STATE[shaKey] = result.content.sha;
  } catch (err) {
    if (/\b(422|409)\b/.test(err.message)) {
      const fresh = await ghGetFile(path);
      if (fresh) STATE[shaKey] = fresh.sha;
      const result = await ghPutText(path, contentStr, message, STATE[shaKey]);
      STATE[shaKey] = result.content.sha;
    } else {
      throw err;
    }
  }
}

function saveSongs(message) {
  return saveJsonWithRetry(SONGS_PATH, { songs: STATE.songs }, message, 'songsSha');
}

function saveCalendarFile(message) {
  return saveJsonWithRetry(CALENDAR_PATH, STATE.calendar, message, 'calSha');
}

/* Saves the calendar, then pushes slot/solo to the Service Schedule repo. */
async function saveCalendar(message, statusEl) {
  setStatus(statusEl, 'Saving…');
  await saveCalendarFile(message);
  setStatus(statusEl, 'Saved. Syncing schedule…', 'ok');
  try {
    const report = await syncScheduleRepo();
    setStatus(statusEl, `Saved. ${report.message}`, 'ok');
  } catch (err) {
    setStatus(statusEl, `Saved, but the schedule sync failed: ${err.message}`, 'err');
  }
}

  return STATE.songs.filter(s => {
    if (STATE.activeTag === UPCOMING_FILTER) {

    } else if (STATE.activeTag && !(s.tags || []).includes(STATE.activeTag)) {

    return s.title.toLowerCase().includes(q)

/* ---- Letter grouping + Upcoming, mirroring the public app ---- */

function groupByLetter(songs) {
  const groups = new Map();
  songs.slice().sort((a, b) => a.title.localeCompare(b.title)).forEach(song => {
    const letter = letterFor(song.title);
    if (!groups.has(letter)) groups.set(letter, []);
    groups.get(letter).push(song);
  });
  return Array.from(groups.keys())
    .sort((a, b) => (a === '#' ? 1 : b === '#' ? -1 : a.localeCompare(b)))
    .map(k => [k, groups.get(k)]);
}

function letterFor(title) {
  const ch = String(title || '').trim().charAt(0).toUpperCase();
  return /[A-Z]/.test(ch) ? ch : '#';
}

/* The same rolling window the public calendar uses, so "Upcoming" rotates with it. */
function upcomingServices() {
  const today = todayStr();
  const cutoff = addDays(today, CALENDAR_DAYS_AHEAD);
  return (STATE.calendar.services || []).filter(s => s && s.date && s.date >= today && s.date <= cutoff);
}

function upcomingSongKeys() {
  const ids = new Set();
  const titles = new Set();
  upcomingServices().forEach(svc => {
    (svc.songs || []).forEach(entry => {
      if (!entry) return;
      if (entry.songId) ids.add(entry.songId);
      else if (entry.title) titles.add(String(entry.title).trim().toLowerCase());
    });
  });
  return { ids, titles };
}

/* keys is an optional precomputed cache. Guard its shape: passing this straight
   to Array.filter would hand us the element index as the second argument. */
function isUpcomingSong(song, keys) {
  const k = keys && keys.ids ? keys : upcomingSongKeys();
  return k.ids.has(song.id) || k.titles.has(String(song.title).trim().toLowerCase());
}

  });

  const multiInput = document.getElementById('multi-track-input');
  if (multiInput) {
    multiInput.onchange = (e) => stageMultiTracks(song, Array.from(e.target.files || []));
  }
}

/* ---- Multi-file upload: guess each voice part from the file name ---- */

const PART_PATTERNS = [
  { part: 'Demo',    re: /\b(demo|full ?mix|all ?parts)\b/ },
  { part: 'Soprano', re: /\b(soprano|sop)\b/ },
  { part: 'Alto',    re: /\b(alto|alt)\b/ },
  { part: 'Tenor',   re: /\b(tenor|ten)\b/ },
  { part: 'Bass',    re: /\b(bass|bs)\b/ },
];

let MULTI_QUEUE = [];

function guessPartFromFilename(filename) {
  const stem = baseNameNoExt(filename).replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim();
  const hay = ' ' + stem.toLowerCase() + ' ';
  for (const { part, re } of PART_PATTERNS) {
    if (re.test(hay)) return part;
  }
  /* No voice part in the name — fall back to the file name so nothing is guessed wrongly. */
  const words = stem.split(' ').filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1));
  return words.join(' ') || 'Track';
}

function partRank(name) {
  const i = TRACK_PARTS.findIndex(p => p.toLowerCase() === String(name).toLowerCase());
  return i === -1 ? TRACK_PARTS.length : i;
}

function stageMultiTracks(song, files) {
  MULTI_QUEUE = files.map(f => ({ file: f, name: guessPartFromFilename(f.name) }));
  /* Standard part order, so the app's tabs come out Demo → Soprano → Alto → Tenor → Bass. */
  MULTI_QUEUE.sort((a, b) => partRank(a.name) - partRank(b.name));
  renderMultiStage(song);
}

function renderMultiStage(song) {
  const el = document.getElementById('multi-stage');
  if (!el) return;
  if (!MULTI_QUEUE.length) { el.innerHTML = ''; return; }

  el.innerHTML = `
    <div class="field-label" style="margin-top:.7rem">Review ${MULTI_QUEUE.length} file(s)</div>
    ${MULTI_QUEUE.map((item, i) => `
      <div class="item-row track-row" data-index="${i}">
        <div class="row-meta">${i + 1}.</div>
        <div><input type="text" class="inline-input multi-name" value="${escapeAttr(item.name)}" aria-label="Track name"></div>
        <div class="row-meta">${escapeHtml(item.file.name)}<br>${formatSize(item.file.size)}</div>
        <div class="row-actions"><button class="btn plain small multi-drop">Skip</button></div>
      </div>`).join('')}
    <div class="btn-row" style="margin-top:.7rem">
      <button class="btn secondary small" id="multi-upload-btn">Upload ${MULTI_QUEUE.length} track(s)</button>
      <button class="btn plain small" id="multi-cancel-btn">Cancel</button>
    </div>
    <div class="save-status" id="multi-status"></div>`;

  el.querySelectorAll('.item-row').forEach(row => {
    const i = parseInt(row.dataset.index, 10);
    row.querySelector('.multi-name').addEventListener('change', (e) => {
      MULTI_QUEUE[i].name = e.target.value.trim();
    });
    row.querySelector('.multi-drop').addEventListener('click', () => {
      MULTI_QUEUE.splice(i, 1);
      renderMultiStage(song);
    });
  });

  document.getElementById('multi-upload-btn').onclick = () => uploadMultiTracks(song);
  document.getElementById('multi-cancel-btn').onclick = () => {
    MULTI_QUEUE = [];
    const input = document.getElementById('multi-track-input');
    if (input) input.value = '';
    renderMultiStage(song);
  };
}

async function uploadMultiTracks(song) {
  const statusEl = document.getElementById('multi-status');
  const btn = document.getElementById('multi-upload-btn');

  const queue = MULTI_QUEUE.filter(q => String(q.name).trim());
  if (!queue.length) { setStatus(statusEl, 'Give each track a name first.', 'err'); return; }

  btn.disabled = true;
  let added = 0;
  const failures = [];

  for (let i = 0; i < queue.length; i++) {
    const { file, name } = queue[i];
    setStatus(statusEl, `Uploading ${i + 1} of ${queue.length}: ${name}…`);
    try {
      if (!(await confirmLargeFile(file))) { failures.push(`${file.name} (skipped)`); continue; }
      const base64 = await fileToBase64(file);
      const ext = fileExt(file.name) || 'mp3';
      /* uniqueTrackSlug sees the entries pushed earlier in this loop, so
         two files named the same don't overwrite each other. */
      const slug = uniqueTrackSlug(song, slugify(name) || 'track');
      const appPath = `audio/${song.id}/${slug}.${ext}`;
      const existing = await ghGetFile(`docs/${appPath}`).catch(() => null);
      await ghPutBase64(`docs/${appPath}`, base64, `Upload ${name} track: ${song.title}`, existing ? existing.sha : undefined);
      song.tracks.push({ part: name, file: appPath });
      added++;
    } catch (err) {
      failures.push(`${file.name}: ${err.message}`);
    }
  }

  if (added) {
    setStatus(statusEl, 'Saving song list…');
    try {
      await saveSongs(`Add ${added} practice track(s): ${song.title}`);
    } catch (err) {
      setStatus(statusEl, `Files uploaded, but the song list could not be saved: ${err.message}`, 'err');
      btn.disabled = false;
      return;
    }
  }

  MULTI_QUEUE = [];
  const input = document.getElementById('multi-track-input');
  if (input) input.value = '';
  renderTracks(song);
  renderMultiStage(song);

  showToast(failures.length
    ? `${added} uploaded, ${failures.length} could not be added.`
    : `${added} track(s) uploaded.`, !!failures.length);
  if (failures.length) console.error('Multi-upload failures:', failures);
}

function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

async function moveTrack(song, from, to) {
  if (to < 0 || to >= song.tracks.length) return;
  const [item] = song.tracks.splice(from, 1);
  song.tracks.splice(to, 0, item);
  try {
    await saveSongs(`Reorder practice tracks: ${song.title}`);
    renderTracks(song);
  } catch (err) {
    song.tracks.splice(to, 1);
    song.tracks.splice(from, 0, item);
    showToast(err.message, true);
  }
}

async function renameTrack(song, i, value) {
  const name = String(value).trim();
  if (!name || name === song.tracks[i].part) { renderTracks(song); return; }
  const prev = song.tracks[i].part;
  song.tracks[i].part = name;
  try {
    await saveSongs(`Rename track to ${name}: ${song.title}`);
    showToast('Track renamed. The file name in the repo is unchanged.');
    renderTracks(song);
  } catch (err) {
    song.tracks[i].part = prev;
    showToast(err.message, true);
    renderTracks(song);
  }
}

async function removeTrack(song, i) {
  const track = song.tracks[i];
  if (!confirm(`Remove the "${track.part}" track?\n\nThis deletes ${baseName(track.file)} from the repository as well.`)) return;

  const removed = song.tracks.splice(i, 1)[0];
  try {
    await saveSongs(`Remove track ${removed.part}: ${song.title}`);
  } catch (err) {
    song.tracks.splice(i, 0, removed);
    showToast(err.message, true);
    return;
  }

  const ok = await deleteRepoFile(removed.file, `Delete ${removed.part} track: ${song.title}`);
  showToast(ok ? 'Track and file removed.' : 'Entry removed, but the file could not be deleted — check the repo.', !ok);
  renderTracks(song);
}

async function addTrack(song) {
  const statusEl = document.getElementById('track-add-status');
  const nameEl = document.getElementById('new-track-name');
  const fileEl = document.getElementById('new-track-file');
  const btn = document.getElementById('add-track-btn');

  const name = nameEl.value.trim();
  const file = fileEl.files[0];
  if (!name) { setStatus(statusEl, 'Give the track a name first.', 'err'); return; }
  if (!file) { setStatus(statusEl, 'Choose an audio file.', 'err'); return; }
  if (!(await confirmLargeFile(file))) return;

  btn.disabled = true;
  setStatus(statusEl, 'Uploading…');
  try {
    const base64 = await fileToBase64(file);
    const ext = fileExt(file.name) || 'mp3';
    const slug = uniqueTrackSlug(song, slugify(name) || 'track');
    const appPath = `audio/${song.id}/${slug}.${ext}`;

    const existing = await ghGetFile(`docs/${appPath}`).catch(() => null);
    await ghPutBase64(`docs/${appPath}`, base64, `Upload ${name} track: ${song.title}`, existing ? existing.sha : undefined);

    song.tracks.push({ part: name, file: appPath });
    await saveSongs(`Add ${name} track: ${song.title}`);

    nameEl.value = '';
    fileEl.value = '';
    setStatus(statusEl, `Uploaded as ${slug}.${ext}`, 'ok');
    renderTracks(song);
  } catch (err) {
    setStatus(statusEl, err.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

async function replaceTrack(song, i, file) {
  if (!file) return;
  if (!(await confirmLargeFile(file))) return;

  const track = song.tracks[i];
  const oldPath = track.file;
  const ext = fileExt(file.name) || fileExt(oldPath) || 'mp3';
  const slug = baseNameNoExt(oldPath);
  const newPath = `audio/${song.id}/${slug}.${ext}`;

  showToast(`Replacing ${track.part}…`);
  try {
    const base64 = await fileToBase64(file);
    const existing = await ghGetFile(`docs/${newPath}`).catch(() => null);
    await ghPutBase64(`docs/${newPath}`, base64, `Replace ${track.part} track: ${song.title}`, existing ? existing.sha : undefined);

    if (newPath !== oldPath) {
      track.file = newPath;
      await saveSongs(`Replace ${track.part} track: ${song.title}`);
      await deleteRepoFile(oldPath, `Remove superseded ${track.part} track: ${song.title}`);
    }
    showToast(`${track.part} replaced.`);
    renderTracks(song);
  } catch (err) {
    showToast(err.message, true);
    renderTracks(song);
  }
}

function uniqueTrackSlug(song, slug) {
  const taken = new Set((song.tracks || []).map(t => baseNameNoExt(t.file)));
  if (!taken.has(slug)) return slug;
  let n = 2;
  while (taken.has(`${slug}-${n}`)) n++;
  return `${slug}-${n}`;
}

async function moveSheet(song, from, to) {

/* ---------------- Delete song ---------------- */

function wireDeleteSong(song) {
  const btn = document.getElementById('delete-song-btn');
  btn.addEventListener('click', async () => {
    const files = [...song.tracks.map(t => t.file), ...song.sheetMusic.map(s => s.file)];
    const msg = files.length
      ? `Delete "${song.title}" and its ${files.length} file(s) from the repository?\n\nThis cannot be undone.`
      : `Delete "${song.title}"?`;
    if (!confirm(msg)) return;

    const statusEl = document.getElementById('delete-status');

    /* Guard against a second click landing mid-delete: findIndex would return -1
       and splice(-1, 1) would quietly remove a different song. */
    const index = STATE.songs.findIndex(s => s.id === song.id);
    if (index === -1) return;
    btn.disabled = true;

    const removed = STATE.songs.splice(index, 1)[0];

    setStatus(statusEl, 'Removing song…');
    try {
      await saveSongs(`Delete song: ${song.title}`);
    } catch (err) {
      STATE.songs.splice(index, 0, removed);
      btn.disabled = false;
      setStatus(statusEl, err.message, 'err');
      return;
    }

    let failed = 0;
    for (let i = 0; i < files.length; i++) {
      setStatus(statusEl, `Deleting file ${i + 1} of ${files.length}…`);
      const ok = await deleteRepoFile(files[i], `Delete file for removed song: ${song.title}`);
      if (!ok) failed++;
    }

    showToast(failed
      ? `Song deleted, but ${failed} file(s) could not be removed — check the repo.`
      : 'Song and all of its files deleted.', !!failed);
    renderSongList();
    scrollToTop();
  });
}

function wireServiceCard(card) {
  const svc = STATE.calendar.services.find(s => s.id === card.dataset.id);
  if (!svc) return;
  const statusEl = card.querySelector('.svc-status');
  svc.songs = Array.isArray(svc.songs) ? svc.songs : [];

  const delBtn = card.querySelector('.svc-delete');
  delBtn.addEventListener('click', async () => {
    if (!confirm(`Delete the ${formatDateShort(svc.date)} ${(SERVICE_TYPES[svc.type] || {}).short || ''} service?`)) return;
    /* Same -1 guard as song delete: splice(-1, 1) would drop the wrong service. */
    const i = STATE.calendar.services.findIndex(s => s.id === svc.id);
    if (i === -1) return;
    delBtn.disabled = true;
    const removed = STATE.calendar.services.splice(i, 1)[0];
    try {
      await saveCalendar(`Remove service: ${svc.date} ${svc.type}`, statusEl);
      renderCalendarTab();
    } catch (err) {
      STATE.calendar.services.splice(i, 0, removed);
      delBtn.disabled = false;
      setStatus(statusEl, err.message, 'err');
    }
  });

  card.querySelector('.svc-date').addEventListener('change', async (e) => {
    const value = e.target.value;
    if (!value) { renderCalendarTab(); return; }
    const prevDate = svc.date, prevId = svc.id;
    const newId = `${value}-${svc.type}`;
    if (STATE.calendar.services.some(s => s.id === newId && s !== svc)) {
      setStatus(statusEl, 'A service already exists for that date and time.', 'err');
      e.target.value = prevDate;
      return;
    }
    svc.date = value;
    svc.id = newId;
    try { await saveCalendar(`Update service date: ${value}`, statusEl); renderCalendarTab(); }
    catch (err) { svc.date = prevDate; svc.id = prevId; setStatus(statusEl, err.message, 'err'); }
  });

  card.querySelector('.svc-type').addEventListener('change', async (e) => {
    const value = e.target.value;
    const prevType = svc.type, prevId = svc.id;
    const newId = `${svc.date}-${value}`;
    if (STATE.calendar.services.some(s => s.id === newId && s !== svc)) {
      setStatus(statusEl, 'A service already exists for that date and time.', 'err');
      e.target.value = prevType;
      return;
    }
    svc.type = value;
    svc.id = newId;
    try { await saveCalendar(`Update service type: ${svc.date}`, statusEl); renderCalendarTab(); }
    catch (err) { svc.type = prevType; svc.id = prevId; setStatus(statusEl, err.message, 'err'); }
  });

  const specialEl = card.querySelector('.svc-special');
  if (specialEl) {
    specialEl.addEventListener('change', async (e) => {
      const prev = svc.specialName || '';
      svc.specialName = e.target.value.trim();
      try { await saveCalendar(`Update service name: ${svc.date}`, statusEl); }
      catch (err) { svc.specialName = prev; setStatus(statusEl, err.message, 'err'); }
    });
  }

  card.querySelector('.svc-add-song').addEventListener('click', async () => {
    svc.songs.push({ songId: '', title: '', slot: '', soloist: '' });
    try { await saveCalendar(`Add song slot: ${svc.date}`, statusEl); renderCalendarTab(); }
    catch (err) { svc.songs.pop(); setStatus(statusEl, err.message, 'err'); }
  });

  card.querySelectorAll('.cal-song-row').forEach(row => {
    const i = parseInt(row.dataset.index, 10);
    const selectEl = row.querySelector('.cal-song-select');
    const customEl = row.querySelector('.cal-song-custom');

    selectEl.addEventListener('change', async () => {
      const entry = svc.songs[i];
      const prev = { ...entry };
      const val = selectEl.value;
      if (val === '__custom') {
        entry.songId = '';
        customEl.style.display = '';
        customEl.focus();
        return;                       /* wait for a title before saving */
      }
      customEl.style.display = 'none';
      entry.songId = val;
      const song = val ? STATE.songs.find(s => s.id === val) : null;
      entry.title = song ? song.title : '';
      try { await saveCalendar(`Update service songs: ${svc.date}`, statusEl); }
      catch (err) { Object.assign(entry, prev); setStatus(statusEl, err.message, 'err'); renderCalendarTab(); }
    });

    customEl.addEventListener('change', async () => {
      const entry = svc.songs[i];
      const prev = { ...entry };
      entry.songId = '';
      entry.title = customEl.value.trim();
      try { await saveCalendar(`Update service songs: ${svc.date}`, statusEl); }
      catch (err) { Object.assign(entry, prev); setStatus(statusEl, err.message, 'err'); }
    });

    row.querySelector('.cal-slot').addEventListener('change', async (e) => {
      const entry = svc.songs[i];
      const prev = entry.slot;
      entry.slot = e.target.value;
      try { await saveCalendar(`Update slot: ${svc.date}`, statusEl); }
      catch (err) { entry.slot = prev; setStatus(statusEl, err.message, 'err'); }
    });

    row.querySelector('.cal-soloist').addEventListener('change', async (e) => {
      const entry = svc.songs[i];
      const prev = entry.soloist;
      entry.soloist = e.target.value.trim();
      try { await saveCalendar(`Update soloist: ${svc.date}`, statusEl); }
      catch (err) { entry.soloist = prev; setStatus(statusEl, err.message, 'err'); }
    });

    row.querySelector('.cal-song-remove').addEventListener('click', async () => {
      const removed = svc.songs.splice(i, 1)[0];
      try { await saveCalendar(`Remove song from service: ${svc.date}`, statusEl); renderCalendarTab(); }
      catch (err) { svc.songs.splice(i, 0, removed); setStatus(statusEl, err.message, 'err'); }
    });

    row.querySelector('.song-up').addEventListener('click', () => moveServiceSong(svc, i, i - 1, statusEl));
    row.querySelector('.song-down').addEventListener('click', () => moveServiceSong(svc, i, i + 1, statusEl));
  });
}

async function moveServiceSong(svc, from, to, statusEl) {
  if (to < 0 || to >= svc.songs.length) return;
  const [item] = svc.songs.splice(from, 1);
  svc.songs.splice(to, 0, item);
  try { await saveCalendar(`Reorder songs: ${svc.date}`, statusEl); renderCalendarTab(); }
  catch (err) {
    svc.songs.splice(to, 1);
    svc.songs.splice(from, 0, item);
    setStatus(statusEl, err.message, 'err');
  }
}

async function addService() {
  const statusEl = document.getElementById('svc-add-status');
  const date = document.getElementById('new-svc-date').value;
  const type = document.getElementById('new-svc-type').value;
  if (!date) { setStatus(statusEl, 'Pick a date.', 'err'); return; }

  const id = `${date}-${type}`;
  if (STATE.calendar.services.some(s => s.id === id)) {
    setStatus(statusEl, 'That service already exists.', 'err');
    return;
  }

  const svc = { id, date, type, songs: [] };
  STATE.calendar.services.push(svc);
  try {
    await saveCalendar(`Add service: ${date} ${type}`, statusEl);
    renderCalendarTab();
  } catch (err) {
    STATE.calendar.services.pop();
    setStatus(statusEl, err.message, 'err');
  }
}

function compareServices(a, b) {
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  return typeOrder(a.type) - typeOrder(b.type);
}

function typeOrder(type) {
  const meta = SERVICE_TYPES[type];
  return meta ? meta.order : 99;
}

/* ================================================================
   Service Schedule sync — choir app is the source of truth
   ================================================================ */

function schedToken() {
  let t = null;
  try { t = localStorage.getItem(SCHED_PAT_KEY); } catch {}
  return t || getToken();
}

async function syncScheduleRepo() {
  const lines = [];
  const desired = new Map();
  let wednesdaySkipped = 0;
  const mixedSlots = [];

  for (const svc of STATE.calendar.services || []) {
    if (!SCHED_SYNC_TYPES.includes(svc.type)) {
      if (svc.type === 'wednesday') wednesdaySkipped++;
      continue;
    }
    const songs = Array.isArray(svc.songs) ? svc.songs : [];
    const slots = Array.from(new Set(songs.map(s => String(s.slot || '').trim()).filter(Boolean)));
    if (slots.length > 1) mixedSlots.push(`${svc.date} ${svc.type}`);
    desired.set(`${svc.date}|${svc.type}`, {
      slot: slots[0] || null,                                              /* null → leave as-is */
      solo: songs.some(s => String(s.soloist || '').trim()) ? 'Y' : 'N',
    });
  }

  if (!desired.size) {
    return { message: 'No Sunday services to sync.', detail: 'No Sunday services to sync.' };
  }

  let file;
  try {
    file = await apiGetFile(SCHED_OWNER, SCHED_REPO, SCHED_BRANCH, SCHED_PATH, schedToken());
  } catch (err) {
    if (err.status === 401 || err.status === 403 || err.status === 404) {
      throw new Error(`no access to ${SCHED_OWNER}/${SCHED_REPO} (${err.status}). Add that repo to your token, or set a separate token under “Use a separate token”.`);
    }
    throw err;
  }
  if (!file) throw new Error(`${SCHED_PATH} not found in ${SCHED_OWNER}/${SCHED_REPO}.`);

  const entries = JSON.parse(file.content);
  if (!Array.isArray(entries)) throw new Error('schedule-data.json is not an array.');

  let changed = 0;
  const matched = new Set();

  for (const entry of entries) {
    if (!SCHED_SYNC_TYPES.includes(entry.type)) continue;
    const key = `${entry.date}|${entry.type}`;
    const want = desired.get(key);
    if (!want) continue;                       /* not managed here — leave untouched */
    matched.add(key);

    if (!entry.choir) entry.choir = { slot: '1', solo: 'N' };
    if (want.slot && entry.choir.slot !== want.slot) { entry.choir.slot = want.slot; changed++; }
    if (entry.choir.solo !== want.solo) { entry.choir.solo = want.solo; changed++; }
  }

  const unmatched = Array.from(desired.keys()).filter(k => !matched.has(k));

  if (!changed) {
    lines.push('Schedule already up to date.');
  } else {
    /* The schedule app writes minified JSON with no trailing newline — match it exactly. */
    await apiPut(SCHED_OWNER, SCHED_REPO, SCHED_BRANCH, SCHED_PATH,
      b64EncodeUnicode(JSON.stringify(entries)),
      'Sync choir slot/solo from choir-vault', file.sha, schedToken());
    lines.push(`Schedule updated: ${changed} field(s) changed across ${matched.size} service(s).`);
  }

  if (unmatched.length) lines.push(`Not found in the schedule (skipped): ${unmatched.map(k => k.replace('|', ' ')).join(', ')}`);
  if (mixedSlots.length) lines.push(`More than one slot set, used the first: ${mixedSlots.join(', ')}`);
  if (wednesdaySkipped) lines.push(`Wednesday service(s) skipped (${wednesdaySkipped}) — the schedule has no choir field on Wednesdays.`);

  return { message: lines[0], detail: lines.join('\n') };
}

function renderDirectorFields() {

  if (!fields.length) {
    el.innerHTML = `<div class="tbd-note">No contact fields yet.</div>`;

  }

  el.innerHTML = fields.map((f, i) => `
    <div class="item-row dir-row" data-index="${i}">
      <div class="reorder-btns">
        <button class="btn plain tiny dir-up" ${i === 0 ? 'disabled' : ''} title="Move up">&uarr;</button>

  el.querySelectorAll('.dir-row').forEach(row => {
    const i = parseInt(row.dataset.index, 10);
    row.querySelector('.dir-remove').addEventListener('click', () => {
      readDirectorFieldsFromDom();
      STATE.calendar.director.fields.splice(i, 1);
      renderDirectorFields();
    });
    row.querySelector('.dir-up').addEventListener('click', () => moveDirectorField(i, i - 1));
    row.querySelector('.dir-down').addEventListener('click', () => moveDirectorField(i, i + 1));
  });
}

function moveDirectorField(from, to) {
  const fields = STATE.calendar.director.fields;
  if (to < 0 || to >= fields.length) return;
  readDirectorFieldsFromDom();
  const [item] = fields.splice(from, 1);
  fields.splice(to, 0, item);
  renderDirectorFields();
}

/* Pulls what's currently typed into STATE before any re-render, so reordering or
   adding a row can't discard edits that haven't been saved yet. */
function readDirectorFieldsFromDom() {
  const rows = document.querySelectorAll('.dir-row');
  if (!rows.length) return;
  rows.forEach(row => {
    const i = parseInt(row.dataset.index, 10);
    const f = STATE.calendar.director.fields[i];
    if (!f) return;
    f.label = row.querySelector('.dir-label').value;
    f.value = row.querySelector('.dir-value').value;
    f.type = row.querySelector('.dir-type').value;
  });
}

/* ================================================================
   HTML sanitizer (mirrors js/app.js)
   ================================================================ */

const SANITIZE_ALLOW = new Set(['P','BR','B','STRONG','I','EM','U','UL','OL','LI','A','H3','H4','BLOCKQUOTE']);
const SANITIZE_RENAME = { DIV: 'P', H1: 'H3', H2: 'H3', H5: 'H4', H6: 'H4', STRIKE: 'EM', S: 'EM' };
const SANITIZE_DROP = 'script,style,iframe,object,embed,link,meta,img,svg,form,input,button,select,textarea,noscript,title,base';

function sanitizeHtml(html) {
  if (!html) return '';
  const doc = new DOMParser().parseFromString('<body><div id="sanitize-root"></div></body>', 'text/html');
  const host = doc.getElementById('sanitize-root');
  host.innerHTML = String(html);

  host.querySelectorAll(SANITIZE_DROP).forEach(n => n.remove());

  const walker = doc.createTreeWalker(host, NodeFilter.SHOW_COMMENT);
  const comments = [];
  while (walker.nextNode()) comments.push(walker.currentNode);
  comments.forEach(c => c.remove());

  sanitizeChildren(host);
  return host.innerHTML;
}

function sanitizeChildren(parent) {
  Array.from(parent.children).forEach(child => {
    sanitizeChildren(child);
    const tag = child.tagName;

    if (SANITIZE_ALLOW.has(tag)) { stripAttributes(child); return; }

    const renameTo = SANITIZE_RENAME[tag];
    if (renameTo) {
      const rep = child.ownerDocument.createElement(renameTo);
      while (child.firstChild) rep.appendChild(child.firstChild);
      child.replaceWith(rep);
      stripAttributes(rep);
      return;
    }

    const frag = child.ownerDocument.createDocumentFragment();
    while (child.firstChild) frag.appendChild(child.firstChild);
    child.replaceWith(frag);
  });
}

function stripAttributes(el) {
  const href = el.tagName === 'A' ? el.getAttribute('href') : null;
  Array.from(el.attributes).forEach(a => el.removeAttribute(a.name));
  if (el.tagName === 'A' && href && /^(https?:|mailto:|tel:)/i.test(href.trim())) {
    el.setAttribute('href', href.trim());
    el.setAttribute('target', '_blank');
    el.setAttribute('rel', 'noopener noreferrer');
  }
}

/* ================================================================
   Utilities
   ================================================================ */

function pad2(n) { return String(n).padStart(2, '0'); }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function addDays(dateStr, days) {
  const [y, m, d] = String(dateStr).split('-').map(Number);
  const dt = new Date(y, m - 1, d + days);
  return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
}

function nextSundayStr() {
  const d = new Date();
  d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function parseLocalDate(dateStr) {
  const [y, m, d] = String(dateStr).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}

function formatDateShort(dateStr) {
  const d = parseLocalDate(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString();
}

function slugify(str) {
  return String(str).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function baseName(file) {
  const parts = String(file || '').split('/');
  return parts[parts.length - 1] || '';
}

function fileExt(file) {
  const name = baseName(file);
  const i = name.lastIndexOf('.');
  return i > 0 ? name.slice(i + 1).toLowerCase() : '';
}

function baseNameNoExt(file) {
  const name = baseName(file);
  const i = name.lastIndexOf('.');
  return i > 0 ? name.slice(0, i) : name;
}

async function confirmLargeFile(file) {
  if (file.size <= 15 * 1024 * 1024) return true;
  return confirm(`This file is ${(file.size / 1024 / 1024).toFixed(1)} MB — larger than the recommended 15 MB limit. Upload anyway?`);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function b64EncodeUnicode(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

function b64DecodeUnicode(b64) {
  const binary = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array([...binary].map(c => c.charCodeAt(0)));
  return new TextDecoder().decode(bytes);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}
function escapeAttr(str) { return escapeHtml(str); }

/* Feeds the real tab-bar height to CSS so the sticky song header sits directly
   below it, including when the bar wraps to two rows on a narrow screen. */
function syncBarHeight() {
  const bar = document.querySelector('.sticky-bar');
  if (!bar) return;
  document.documentElement.style.setProperty('--admin-bar-h', bar.offsetHeight + 'px');
}

/* Instant jump to the top, used when moving between views. In-place refreshes
   (a track upload, a calendar edit) deliberately don't call this, so you aren't
   yanked away from the row you're working on. */
function scrollToTop() {
  const jump = () => {
    try {
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    } catch {
      window.scrollTo(0, 0);
    }
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  };
  jump();
  requestAnimationFrame(jump);
}

function setStatus(el, msg, cls) {
  if (!el) return;
  el.textContent = msg;
  el.className = 'save-status' + (cls ? ' ' + cls : '');
}

function showToast(msg, isError) {
  const toast = document.createElement('div');
  toast.className = 'toast' + (isError ? ' error' : '');
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}
</script>
